<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0EEE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kern" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=DM+Mono:wght@400;500&family=Vazirmatn:wght@400..700&display=swap"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <script>
      // apply the persisted theme before first paint to avoid a flash
      var storedTheme = null
      var prefersDark = false
      try {
        storedTheme = localStorage.getItem('kern.theme')
        prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
      } catch (_) {}
      if (storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark)) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
